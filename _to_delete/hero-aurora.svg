<svg id="hero-aurora" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1728 903" preserveAspectRatio="none" aria-hidden="true" focusable="false" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
    <defs>
        <linearGradient id="ha-ribbon-a" gradientUnits="userSpaceOnUse" x1="700" y1="160" x2="820" y2="420">
            <stop offset="0" stop-color="#ff3a46" stop-opacity="0.30"/>
            <stop offset="1" stop-color="#ff3a46" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="ha-ribbon-b" gradientUnits="userSpaceOnUse" x1="250" y1="40" x2="330" y2="230">
            <stop offset="0" stop-color="#e01828" stop-opacity="0.45"/>
            <stop offset="1" stop-color="#e01828" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="ha-streak" gradientUnits="userSpaceOnUse" x1="640" y1="330" x2="1390" y2="0">
            <stop offset="0" stop-color="#fff" stop-opacity="0"/>
            <stop offset="0.55" stop-color="#ffd0d0" stop-opacity="0.16"/>
            <stop offset="1" stop-color="#fff" stop-opacity="0.04"/>
        </linearGradient>
        <filter id="ha-blur-lg" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="38"/></filter>
        <filter id="ha-blur-sm" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
    </defs>

    <!-- Soft aurora glows (these drift slowly) -->
    <g class="ha-glow ha-glow-1">
        <ellipse cx="720" cy="190" rx="560" ry="70" transform="rotate(-24 720 190)" fill="#ff2e3e" opacity="0.32" filter="url(#ha-blur-lg)"/>
    </g>
    <g class="ha-glow ha-glow-2">
        <ellipse cx="1260" cy="70" rx="440" ry="48" transform="rotate(-22 1260 70)" fill="#ff7a2a" opacity="0.20" filter="url(#ha-blur-lg)"/>
    </g>

    <!-- Light ribbons, sharp on their top edge and fading downward -->
    <g class="ha-ribbons">
        <polygon points="0,640 0,400 1260,0 1620,0" fill="url(#ha-ribbon-a)"/>
        <polygon points="0,250 0,125 430,0 720,0" fill="url(#ha-ribbon-b)"/>
        <polygon class="ha-streak" points="640,330 1350,0 1400,0 700,330" fill="url(#ha-streak)" filter="url(#ha-blur-sm)"/>
    </g>

    <!-- Top-left accent tab -->
    <path d="M-40 -12 H112 a12 12 0 0 1 10.4 18 L72 92 a22 22 0 0 1 -19 11 H-40 Z" fill="#c8121f" opacity="0.75"/>

    <!-- Dot grid -->
    <g fill="#fff" opacity="0.9">
        <circle cx="1516" cy="8" r="2.4"/><circle cx="1536" cy="8" r="2.4"/><circle cx="1556" cy="8" r="2.4"/><circle cx="1576" cy="8" r="2.4"/><circle cx="1596" cy="8" r="2.4"/>
        <circle cx="1516" cy="28" r="2.4"/><circle cx="1536" cy="28" r="2.4"/><circle cx="1556" cy="28" r="2.4"/><circle cx="1576" cy="28" r="2.4"/><circle cx="1596" cy="28" r="2.4"/>
        <circle cx="1516" cy="48" r="2.4"/><circle cx="1536" cy="48" r="2.4"/><circle cx="1556" cy="48" r="2.4"/><circle cx="1576" cy="48" r="2.4"/><circle cx="1596" cy="48" r="2.4"/>
    </g>
</svg>
