<svg id="hero-icons" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1728 903" preserveAspectRatio="none" aria-hidden="true" focusable="false" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
    <defs>
        <linearGradient id="hi-arc" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#ff8a1f" stop-opacity="0"/>
            <stop offset="0.08" stop-color="#ff8a1f"/>
            <stop offset="0.6" stop-color="#f05a1a"/>
            <stop offset="1" stop-color="#e3242b" stop-opacity="0.15"/>
        </linearGradient>
        <radialGradient id="hi-disc" cx="0.38" cy="0.32" r="0.75">
            <stop offset="0" stop-color="#e5222f"/>
            <stop offset="0.55" stop-color="#b80d1b"/>
            <stop offset="1" stop-color="#8e0612"/>
        </radialGradient>
        <linearGradient id="hi-sheen" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#fff" stop-opacity="0"/>
            <stop offset="0.48" stop-color="#fff" stop-opacity="0"/>
            <stop offset="0.5" stop-color="#fff" stop-opacity="0.14"/>
            <stop offset="0.62" stop-color="#fff" stop-opacity="0.04"/>
            <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <filter id="hi-glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="7" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="hi-line-glow" x="-10%" y="-10%" width="120%" height="120%">
            <feGaussianBlur stdDeviation="2.5" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <g id="hi-badge">
            <circle r="44" fill="#ff2a3a" opacity="0.35" filter="url(#hi-glow)"/>
            <circle r="41" fill="url(#hi-disc)"/>
            <circle r="41" fill="url(#hi-sheen)"/>
            <circle r="40.2" fill="none" stroke="#ff8d97" stroke-opacity="0.85" stroke-width="1.6"/>
        </g>
    </defs>

    <!-- The orange arc linking the three badges -->
    <path class="hi-arc" d="M880 275 C 910 262, 940 245.8, 963.5 234.5 C 1040 197, 1090 178, 1140 166 C 1205 151, 1250 146, 1300 140 C 1420 127, 1560 108, 1728 64"
        fill="none" stroke="url(#hi-arc)" stroke-width="2.6" stroke-linecap="round" filter="url(#hi-line-glow)" pathLength="1"/>

    <!-- Team -->
    <g transform="translate(963.5 234.5)"><g class="hi-node">
        <use href="#hi-badge"/>
        <g transform="translate(-19.2 -19.2) scale(1.6)" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8.2" r="3.2"/>
            <path d="M6.6 19.5v-1.2a5.4 5.4 0 0 1 10.8 0v1.2"/>
            <circle cx="5.4" cy="10" r="2.3"/>
            <path d="M1.6 18.4v-.6a3.7 3.7 0 0 1 3.8-3.7"/>
            <circle cx="18.6" cy="10" r="2.3"/>
            <path d="M22.4 18.4v-.6a3.7 3.7 0 0 0-3.8-3.7"/>
        </g>
    </g></g>

    <!-- Idea -->
    <g transform="translate(1140 166)"><g class="hi-node">
        <use href="#hi-badge"/>
        <g transform="translate(-19.2 -19.2) scale(1.6)" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1.2v2M5.3 3.6l1.4 1.4M18.7 3.6l-1.4 1.4"/>
            <path d="M9.4 17.2c0-1.4-.5-2.3-1.4-3.2a5.2 5.2 0 1 1 8 0c-.9.9-1.4 1.8-1.4 3.2Z"/>
            <path d="M14.2 8.6a2.4 2.4 0 0 0-1.6-1.6"/>
            <path d="M9.6 19.6h4.8M10.4 21.8h3.2"/>
        </g>
    </g></g>

    <!-- Launch -->
    <g transform="translate(1300 140)"><g class="hi-node">
        <use href="#hi-badge"/>
        <g transform="translate(-19.2 -19.2) scale(1.6)" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9.2 14.8 6.4 12c1.6-4.6 5-8.6 13.8-9.4.4 0 .7.3.6.7-.8 8.8-4.8 12.2-9.4 13.8Z"/>
            <circle cx="15.2" cy="8.8" r="1.7"/>
            <path d="M7.4 10.4 4.2 10.8 2.6 13.2l4.2.9M13.6 16.6l-.4 3.2-2.4 1.6-.9-4.2"/>
            <path d="M5.6 16.4 2.4 19.6M7.6 18.4l-2 2M4 14.8l-1.6 1.6"/>
        </g>
    </g></g>
</svg>
