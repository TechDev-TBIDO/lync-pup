; Loaded via the Azure app setting
;   PHP_INI_SCAN_DIR=/usr/local/etc/php/conf.d:/home/site/wwwroot/deploy
; Roadblock/Information Sheet files: 10MB each (5 per request); profile photos: up to 20MB raw.
upload_max_filesize = 20M
post_max_size = 60M
max_file_uploads = 20

; Keep compiled PHP in memory between requests (big win on Azure, whose
; /home file share is slow to read). Files are re-checked every 60 seconds,
; so a deploy is picked up within a minute.
opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
realpath_cache_size = 4096K
realpath_cache_ttl = 600
